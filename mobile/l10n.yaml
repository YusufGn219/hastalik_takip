# Çeviri altyapısı. Şablon dil Türkçe; yeni dil = yeni app_<dil>.arb dosyası.
# Üretilen dosyalar lib/l10n/ altında durur ve depoya girer (app_database.g.dart gibi).
arb-dir: lib/l10n
template-arb-file: app_tr.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
